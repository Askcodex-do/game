name: Build Windows EXE

# Produces a standalone Windows executable with PyInstaller. The build runs on
# a Windows runner because a real .exe cannot be cross-compiled from Linux.
#
# The resulting artifact targets Windows 8.1 / 10 / 11 on x64.
#
# Trigger it from the Actions tab ("Run workflow") or by pushing a tag like
# v1.0.0. The finished .exe is attached to the workflow run as an artifact, and
# to a GitHub Release when triggered by a tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the artifact (e.g. 1.0.0)"
        required: false
        default: "dev"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Keep the build reproducible and avoid the noisy Python 3.13 free-threading
  # variants; 3.10 matches the project's stated target interpreter.
  PYTHON_VERSION: "3.10"

jobs:
  build-windows:
    name: Build game.exe
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Show interpreter version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.11.1 pytest==8.3.3

      - name: Run the test suite (gate the build on it)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest tests -q

      - name: Run the headless smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python main.py --smoke 600

      - name: Build the executable
        run: python -m PyInstaller covert_strike.spec --noconfirm --clean

      - name: Verify the executable exists
        shell: pwsh
        run: |
          $exe = "dist/CovertStrike.exe"
          if (-not (Test-Path $exe)) { throw "Build did not produce $exe" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ("Built {0} ({1:N1} MB)" -f $exe, $size)

      - name: Verify the executable carries an icon and version resource
        shell: pwsh
        run: |
          # A missing icon or version block would mean the resource compiler
          # silently skipped assets/, which is easy to miss from the log alone.
          $exe = Get-Item "dist/CovertStrike.exe"
          $info = $exe.VersionInfo
          Write-Host ("FileDescription: {0}" -f $info.FileDescription)
          Write-Host ("ProductName:     {0}" -f $info.ProductName)
          if ($info.ProductName -notlike "*Covert Strike*") {
            throw "Version resource is missing or wrong: '$($info.ProductName)'"
          }
          # Extract the icon group; a sizeable blob proves the art was embedded.
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe.FullName)
          if ($null -eq $icon) { throw "No icon embedded in the executable" }
          Write-Host ("Icon size: {0}x{1}" -f $icon.Width, $icon.Height)

      - name: Smoke-run the packaged executable
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          # The packaged binary supports the same headless smoke mode, which
          # proves the frozen bundle can start, build its assets and simulate
          # frames without a display.
          #
          # The game is linked as a windowed app, so it has no console and the
          # call operator (&) does not wait for it - $LASTEXITCODE would be
          # stale. Start-Process -Wait -PassThru blocks and gives us the real
          # exit code. Its stdout still reaches the log through a redirect.
          $out = "smoke_out.txt"
          $err = "smoke_err.txt"
          $proc = Start-Process -FilePath "./dist/CovertStrike.exe" `
            -ArgumentList "--smoke", "200" -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out -ErrorAction SilentlyContinue | Write-Host
          Get-Content $err -ErrorAction SilentlyContinue | Write-Host
          Write-Host ("Packaged smoke run exit code: {0}" -f $proc.ExitCode)
          if ($proc.ExitCode -ne 0) { throw "Packaged smoke test failed (exit $($proc.ExitCode))" }

      - name: Upload the executable artifact
        # Always upload, so the .exe is available for download even if a later
        # verification step has trouble.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CovertStrike-windows-x64-${{ github.event.inputs.version || github.ref_name }}
          path: dist/CovertStrike.exe
          if-no-files-found: error

      - name: Attach the executable to a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CovertStrike.exe
          generate_release_notes: true
